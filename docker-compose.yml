services:
  postgres:
    image: postgres:16-alpine
    container_name: capturelock-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-capturelock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-capturelock}
      POSTGRES_DB: ${POSTGRES_DB:-capturelock_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-capturelock} -d ${POSTGRES_DB:-capturelock_dev}',
        ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
